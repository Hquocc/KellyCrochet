<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KellyCrochet – Đặt món riêng</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/pages/custom.css" />
</head>
<body>

  <div id="header-root"></div>
  <div id="cart-drawer-root"></div>
  <div id="search-overlay-root"></div>
  <div id="toast-root"></div>

  <!-- ===================== PAGE: CUSTOM ORDER ===================== -->
  <main id="page-custom">

    <div class="custom-layout">

      <!-- Left: Info -->
      <div class="custom-info section-fade-in">
        <p class="custom-info__eyebrow">ĐỘC BẢN</p>
        <h1 class="custom-info__title">Đặt một món riêng</h1>
        <p class="custom-info__desc">
          Kể cho Kelly nghe ý tưởng của bạn — màu len, kích thước, người nhận.
          Kelly sẽ liên hệ báo giá trong 24 giờ.
        </p>
        <img
          src="assets/images/crochet-work.png"
          alt="Đôi tay đang móc túi len thủ công"
          class="custom-info__img custom-info__img--reveal"
        />
      </div>

      <!-- Right: Form -->
      <div class="custom-form-wrap section-fade-in">
        <form class="custom-form" id="custom-order-form" novalidate>

          <div class="custom-form__row">
            <div class="form-field">
              <label class="form-label" for="customer-name">TÊN CỦA BẠN</label>
              <input class="form-input" id="customer-name" type="text" name="name" maxlength="120" placeholder="VD: Thu Hà" required />
              <span class="form-error" id="error-name"></span>
            </div>

            <div class="form-field">
              <label class="form-label" for="customer-phone">SỐ ĐIỆN THOẠI</label>
              <input class="form-input" id="customer-phone" type="tel" name="phone" autocomplete="tel" inputmode="tel" pattern="[0-9+() -]{8,30}" maxlength="30" title="Vui lòng nhập số điện thoại hợp lệ." placeholder="VD: 0912 345 678" required />
              <span class="form-error" id="error-phone"></span>
            </div>
          </div>

          <div class="custom-form__row">
            <div class="form-field">
              <label class="form-label" for="customer-email">EMAIL</label>
              <input class="form-input" id="customer-email" type="email" name="email" autocomplete="email" maxlength="254" placeholder="VD: email@example.com" required />
              <span class="form-error" id="error-email"></span>
            </div>

            <div class="form-field">
              <label class="form-label" for="customer-productName">TÊN SẢN PHẨM MUỐN LÀM</label>
              <input class="form-input" id="customer-productName" type="text" name="productName" required maxlength="160" placeholder="VD: Túi tote đeo vai" />
              <span class="form-error" id="error-productName"></span>
            </div>
          </div>

          <div class="form-field">
            <label class="form-label">LOẠI SẢN PHẨM</label>
            <div class="tag-group" id="product-type-group">
              <button type="button" class="tag tag--active" data-value="túi">Túi</button>
              <button type="button" class="tag" data-value="mũ">Mũ</button>
              <button type="button" class="tag" data-value="khăn">Khăn</button>
              <button type="button" class="tag" data-value="thú bông">Thú bông</button>
              <button type="button" class="tag" data-value="khác">Khác</button>
            </div>
            <input type="hidden" name="productType" id="product-type-value" value="túi" />
            <span class="form-error" id="error-productType"></span>
          </div>

          <div class="custom-form__row">
            <div class="form-field">
              <label class="form-label" for="color-wish">MÀU SẮC MONG MUỐN</label>
              <input
                class="form-input"
                id="color-wish"
                type="text"
                name="color"
                required
                maxlength="800"
                placeholder="VD: kem phối hồng đất"
              />
              <span class="form-error" id="error-color"></span>
            </div>

            <div class="form-field">
              <label class="form-label" for="budget">NGÂN SÁCH DỰ KIẾN</label>
              <select class="form-select" id="budget" name="budget">
                <option value="under100">Dưới 100.000₫</option>
                <option value="under400">Dưới 300.000₫</option>
                <option value="under500">Dưới 500.000₫</option> 
                <option value="discuss">Thảo luận thêm</option>
              </select>
            </div>
          </div>

          <div class="form-field">
            <label class="form-label" for="description">MÔ TẢ CHI TIẾT</label>
            <textarea
              class="form-textarea"
              id="description"
              name="description"
              rows="3"
              required
              maxlength="5000"
              placeholder="Kể cho Kelly nghe thêm về kích thước, người nhận hoặc ý tưởng..."
            ></textarea>
            <span class="form-error" id="error-description"></span>
          </div>

          <button type="submit" class="btn btn--dark btn--full">GỬI YÊU CẦU</button>

        </form>
      </div>

    </div>
  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/search.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/pages/custom.js"></script>
</body>
</html>
