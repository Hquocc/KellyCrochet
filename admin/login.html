<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f6f2" />
  <title>KellyCrochet Admin – Đăng nhập</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <a class="login-brand" href="../index.html" aria-label="KellyCrochet – Trang chủ">
      <img src="../assets/images/favicon.png" alt="" width="56" height="56" />
      <span>KellyCrochet<small>KHU VỰC QUẢN TRỊ</small></span>
    </a>

    <div class="login-heading">
      <p class="eyebrow">CHÀO MỪNG TRỞ LẠI</p>
      <h1>Đăng nhập</h1>
      <p>Đăng nhập để quản lý cửa hàng của bạn.</p>
    </div>

    <form class="login-form" id="admin-login-form">
      <label class="login-field" for="admin-username">
        Tài khoản
        <input id="admin-username" name="username" type="text" autocomplete="username" placeholder="Tên tài khoản" minlength="3" maxlength="50" required />
      </label>

      <label class="login-field" for="admin-password">
        Mật khẩu
        <span class="login-password">
          <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required />
          <button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="admin-password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle><path class="password-toggle__slash" d="m4 4 16 16"></path></svg>
          </button>
        </span>
      </label>

      <p class="login-notice" id="login-error" role="alert" hidden></p>
      <button class="button button--dark login-submit" type="submit">Đăng nhập</button>
    </form>

    <a class="login-back-link" href="../index.html">Quay về cửa hàng</a>
  </main>
  <script src="../js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
