<body><div class="admin-shell"><aside class="sidebar" id="admin-sidebar"></aside><main class="main-content"><header class="topbar" id="admin-topbar"></header><div class="page-content">
  <section class="page-heading"><div><p class="eyebrow">THÔNG TIN CỬA HÀNG</p><h1>Cài đặt</h1><p class="page-heading__subtitle">Cập nhật thông tin chung và phương thức liên hệ.</p></div></section>
  <section class="panel full-panel"><div class="panel-heading"><div><p class="panel-kicker">THÔNG TIN CƠ BẢN</p><h2>Thông tin cửa hàng</h2></div></div><div class="settings-grid"><div class="settings-copy"><h3>KellyCrochet</h3><p>Thông tin hiển thị trên trang cửa hàng và trong liên hệ với khách hàng.</p></div><form class="settings-fields"><label class="settings-field">Tên cửa hàng<input type="text" name="storeName" value="KellyCrochet" required maxlength="100" /></label><label class="settings-field">Email liên hệ<input type="email" name="email" value="hello@kellycrochet.vn" maxlength="254" /></label><label class="settings-field">Số điện thoại<input type="tel" name="phone" value="090 123 4567" maxlength="30" /></label><label class="settings-field">Địa chỉ cửa hàng<input type="text" name="address" value="Thành phố Hồ Chí Minh, Việt Nam" maxlength="250" /></label><p class="settings-hint">Cài đặt được lưu trên trình duyệt này.</p><button class="button button--dark" type="submit">Lưu thay đổi</button></form></div></section>
