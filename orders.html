<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KellyCrochet – Đơn hàng</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/pages/orders.css" />
</head>
<body>

  <div id="header-root"></div>
  <div id="cart-drawer-root"></div>
  <div id="search-overlay-root"></div>
  <div id="toast-root"></div>

  <!-- ===================== PAGE: ORDERS ===================== -->
  <main id="page-orders">

    <div class="orders-header section-fade-in">
      <h1 class="page-title">Đơn hàng của tôi</h1>
      <p class="orders-header__desc">
        Các đơn bạn đã đặt trên thiết bị này sẽ hiện ở đây —
        không cần <a href="#" class="link-underline">tài khoản</a>.
      </p>
    </div>

    <!-- Orders list injected by JS -->
    <div class="orders-container section-fade-in" id="orders-container"></div>

  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/search.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/utils/animations.js"></script>
  <script src="js/pages/orders.js"></script>
</body>
</html>
